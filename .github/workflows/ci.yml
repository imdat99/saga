name: ci

# Pull requests run the full gate. The release workflow calls this one on
# every push to main and tags a version only if every job here passed.
on:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@v8
        with:
          version: v2.15.0
      - name: Release script tests
        run: bash .github/scripts/next-version_test.sh

  test:
    runs-on: ubuntu-latest
    # Integration tests start Postgres 16 and Redis 7 with testcontainers;
    # the hosted runner has Docker.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Unit and integration tests
        run: go test -race -count=1 ./...
      - name: Chaos tests
        run: go test -race -count=1 -tags chaos ./test/chaos/...

  perf:
    runs-on: ubuntu-latest
    # Benchmarks (engine and event bus) against the testcontainers Postgres
    # and Redis, checked against
    # .github/perf-budget.txt (medians of 5 runs). Commit cost is excluded
    # (SAGA_BENCH_ASYNC_COMMIT): the gate measures the engine, not the disk.
    env:
      SAGA_BENCH_ASYNC_COMMIT: "1"
      SAGA_BENCH_MAX_CONNS: "12"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Benchmarks (engine)
        shell: bash # -o pipefail: a failing benchmark must fail the step despite tee
        run: go test -run '^$' -bench . -benchtime 500x -count 5 . | tee bench.txt
      - name: Benchmarks (event bus)
        shell: bash
        run: go test -run '^$' -bench . -benchtime 300x -count 5 ./eventbus/... | tee -a bench.txt
      - name: Performance budget
        run: go run ./internal/tools/benchgate -budget .github/perf-budget.txt -summary "$GITHUB_STEP_SUMMARY" bench.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bench-${{ github.sha }}
          path: bench.txt
