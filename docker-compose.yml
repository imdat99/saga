# Postgres for manual runs and for the tests (make up). Test binaries of every
# package share this server: each test gets its own database (internal/testdb).
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: saga
      POSTGRES_PASSWORD: saga
      POSTGRES_DB: saga
    # go test runs packages in parallel against this one server: the default
    # 100 connections run out.
    command: ["postgres", "-c", "max_connections=500"]
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U saga"]
      interval: 2s
      retries: 20
