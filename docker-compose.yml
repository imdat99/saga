services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: saga
      POSTGRES_PASSWORD: saga
      POSTGRES_DB: saga
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U saga"]
      interval: 2s
      retries: 20

  redis:
    image: redis:7-alpine
    # BullMQ needs noeviction (evicted keys mean lost jobs) and AOF for durability.
    command: ["redis-server", "--maxmemory-policy", "noeviction", "--appendonly", "yes"]
    ports:
      - "6379:6379"
